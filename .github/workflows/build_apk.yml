name: "Build APK (manual)"

# Manually triggered APK build. Run it from the Actions tab, pick any branch.
# Produces app-release.apk as a downloadable workflow artifact. No secrets needed.
on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java
        uses: actions/setup-java@v3.12.0
        with:
          distribution: 'oracle'
          java-version: '17'

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate code (drift, etc.)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Decode release keystore (if available)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "No RELEASE_KEYSTORE_BASE64 secret set -> APK will be debug-signed"
            exit 0
          fi
          OUT="$RUNNER_TEMP/release.jks"
          printf %s "$RELEASE_KEYSTORE_BASE64" \
            | tr -d '[:space:]' \
            | sed 's/^RELEASE_KEYSTORE_BASE64=//' \
            | base64 -d --ignore-garbage > "$OUT" 2>/tmp/b64.err || {
              echo "::error::base64 decode of RELEASE_KEYSTORE_BASE64 failed:"
              cat /tmp/b64.err
              exit 1
            }
          if [ ! -s "$OUT" ]; then
            echo "::error::decoded keystore is empty - check RELEASE_KEYSTORE_BASE64."
            exit 1
          fi
          SIZE=$(stat -c %s "$OUT")
          MAGIC=$(head -c4 "$OUT" | xxd -p)
          echo "Keystore decoded: $SIZE bytes, leading bytes 0x$MAGIC"
          case "$MAGIC" in
            feedfeed|3082*) ;;
            *) echo "::warning::Leading bytes do not look like a JKS (feedfeed) or PKCS12 (3082) file. Build may fail." ;;
          esac
          echo "RELEASE_KEYSTORE_PATH=$OUT" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
