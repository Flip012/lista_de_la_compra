name: "Create Release"

on:
  push:
    branches:
      - master

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set Up Java
        uses: actions/setup-java@v3.12.0
        with:
          distribution: 'oracle'
          java-version: '17'

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate code (drift, etc.)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Decode release keystore (if available)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "No RELEASE_KEYSTORE_BASE64 secret set -> APK will be debug-signed"
            exit 0
          fi
          # Strip whitespace and any stray non-base64 chars (e.g. dotenv-style
          # leading "RELEASE_KEYSTORE_BASE64=" or copy-paste artifacts).
          OUT="$RUNNER_TEMP/release.jks"
          printf %s "$RELEASE_KEYSTORE_BASE64" \
            | tr -d '[:space:]' \
            | sed 's/^RELEASE_KEYSTORE_BASE64=//' \
            | base64 -d --ignore-garbage > "$OUT" 2>/tmp/b64.err || {
              echo "::error::base64 decode of RELEASE_KEYSTORE_BASE64 failed:"
              cat /tmp/b64.err
              exit 1
            }
          if [ ! -s "$OUT" ]; then
            echo "::error::decoded keystore is empty - check RELEASE_KEYSTORE_BASE64."
            exit 1
          fi
          SIZE=$(stat -c %s "$OUT")
          MAGIC=$(head -c4 "$OUT" | xxd -p)
          echo "Keystore decoded: $SIZE bytes, leading bytes 0x$MAGIC"
          # JKS files start with 0xFEEDFEED, PKCS12 with 0x3082 (DER SEQUENCE).
          case "$MAGIC" in
            feedfeed|3082*) ;;
            *) echo "::warning::Leading bytes do not look like a JKS (feedfeed) or PKCS12 (3082) file. Build may fail." ;;
          esac
          echo "RELEASE_KEYSTORE_PATH=$OUT" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: flutter build apk --release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Releases
          path: |
            build/app/outputs/flutter-apk/app-release.apk

      - name: Extract version from pubspec.yaml
        id: extract_version
        run: |
          version=$(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2 | tr -d '\r')
          echo "VERSION=$version" >> $GITHUB_ENV

      - name: Check if Tag Exists
        id: check_tag
        run: |
          if git rev-parse "${{ env.VERSION }}" >/dev/null 2>&1; then
            echo "TAG_EXISTS=true" >> $GITHUB_ENV
          else
            echo "TAG_EXISTS=false" >> $GITHUB_ENV
          fi

      - name: Modify Tag
        if: env.TAG_EXISTS == 'true'
        id: modify_tag
        run: |
          new_version="${{ env.VERSION }}-build-${{ github.run_number }}"
          echo "VERSION=$new_version" >> $GITHUB_ENV
        
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/flutter-apk/app-release.apk"
          tag: ${{ env.VERSION }}
          token: ${{ secrets.GITHUB_TOKEN }}
  